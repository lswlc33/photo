org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# The one place the app version is declared; app/build.gradle.kts only reads it,
# so a version bump stays a one-line reviewable change. PHOTO_VERSION_CODE /
# PHOTO_VERSION_NAME override these for a one-off build without dirtying the
# working tree. Bumping this also means updating the version quoted in README.md
# and index.html, and retaking assets/screens/about.png, which shows it.
photoVersionCode=11
photoVersionName=8.3
