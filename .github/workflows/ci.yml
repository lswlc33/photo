name: CI

# master 是唯一的历史，本地还有 pre-commit 和 commit-msg 两道门禁。
# 这个 workflow 是同一套检查在干净机器上的复核：本地能过不代表换台机器也能过，
# 而没跑过 `git config core.hooksPath .githooks` 的克隆根本没有本地门禁。
on:
  push:
    branches: [master]
    paths-ignore:
      - 'index.html'
      - 'assets/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 提交信息检查要看整段推送范围，浅克隆里看不到推送前的那个提交。
          fetch-depth: 0

      # 提交信息必须用中文写（AGENTS.md 的 Commit Guidelines）。放在最前面：一条
      # 写错语言的提交信息推上来之后只能靠改写历史纠正，所以早失败比晚失败便宜，
      # 也不必先花几分钟跑完 Gradle 才告诉作者这件事。
      - name: Commit messages are written in Chinese
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          range=""
          for candidate in "$PR_BASE" "$PUSH_BEFORE"; do
            if [ -n "$candidate" ] && git cat-file -e "$candidate^{commit}" 2>/dev/null; then
              range="$candidate..HEAD"
              break
            fi
          done
          if [ -n "$range" ]; then
            tools/check-commit-language.sh --range "$range"
          else
            # 新分支的第一次推送，或者手动触发：只检查当前这一个提交。
            tools/check-commit-language.sh
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # gradle-wrapper.properties 指向腾讯云镜像，那对本地构建更快，但 GitHub
      # 的 runner 在境外，从那个镜像拉 Gradle 发行版会很慢。这里只在 CI 的工作
      # 副本里换回官方地址，提交里的镜像地址保持不变。
      - name: Point the wrapper at the upstream Gradle distribution
        run: |
          sed -i 's#mirrors.cloud.tencent.com/Gradle/#services.gradle.org/distributions/#' \
            gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:test --console=plain

      - name: Android lint
        run: ./gradlew :app:lint --console=plain

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: photo-organizer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 失败时报告比日志有用得多，所以无论成败都上传。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          if-no-files-found: ignore
