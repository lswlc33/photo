name: CI

# master 是唯一的历史，本地还有 pre-commit 和 commit-msg 两道门禁。
# 这个 workflow 是同一套检查在干净机器上的复核：本地能过不代表换台机器也能过，
# 而没跑过 `git config core.hooksPath .githooks` 的克隆根本没有本地门禁。
# 检查全过之后，同一个 APK 会被刷新到滚动的 nightly 预发布里 —— 发布出去的必须
# 是刚被检查过的那个构建，而不是另起一次构建的产物。
#
# 每一次推送都构建，只改文档或介绍页的推送也一样：产物名里带着当次提交的短 SHA，
# 「这次提交构建过没有」不应该存在例外。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.PHOTO_RELEASE_KEYSTORE_BASE64 }}
      PHOTO_RELEASE_STORE_PASSWORD: ${{ secrets.PHOTO_RELEASE_STORE_PASSWORD }}
      PHOTO_RELEASE_KEY_ALIAS: ${{ secrets.PHOTO_RELEASE_KEY_ALIAS }}
      PHOTO_RELEASE_KEY_PASSWORD: ${{ secrets.PHOTO_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 提交信息检查要看整段推送范围，浅克隆里看不到推送前的那个提交。
          fetch-depth: 0

      # 提交信息必须用中文写（AGENTS.md 的 Commit Guidelines）。放在最前面：一条
      # 写错语言的提交信息推上来之后只能靠改写历史纠正，所以早失败比晚失败便宜，
      # 也不必先花几分钟跑完 Gradle 才告诉作者这件事。
      - name: Commit messages are written in Chinese
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          range=""
          for candidate in "$PR_BASE" "$PUSH_BEFORE"; do
            if [ -n "$candidate" ] && git cat-file -e "$candidate^{commit}" 2>/dev/null; then
              range="$candidate..HEAD"
              break
            fi
          done
          if [ -n "$range" ]; then
            tools/check-commit-language.sh --range "$range"
          else
            # 新分支的第一次推送，或者手动触发：只检查当前这一个提交。
            tools/check-commit-language.sh
          fi

      # 和提交信息检查同一个道理，也一样便宜：workflow 文件解析不了的时候，GitHub 会
      # 0 秒失败、一个 job 都不跑，于是下面所有检查和 nightly 发布都被静默跳过。这一步
      # 挡不住 ci.yml 自己（它坏掉时这个 workflow 根本不会启动），但挡得住 pages.yml
      # 和 release.yml —— 那两个坏掉的话，除了发布当天没人会发现。
      - name: Workflow files parse
        run: tools/check-workflows.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # gradle-wrapper.properties 指向腾讯云镜像，那对本地构建更快，但 GitHub
      # 的 runner 在境外，从那个镜像拉 Gradle 发行版会很慢。这里只在 CI 的工作
      # 副本里换回官方地址，提交里的镜像地址保持不变。
      - name: Point the wrapper at the upstream Gradle distribution
        run: |
          sed -i 's#mirrors.cloud.tencent.com/Gradle/#services.gradle.org/distributions/#' \
            gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      # 停在 v5 而不是最新的 v6：v6 把缓存实现拆成了闭源的 gradle-actions-caching，
      # 用它就等于接受 Gradle 自己的 Terms of Use（公开仓库不收费，但那是另一份条款）。
      # v5 已经是 Node 24，升级的目的就达到了，所以不必为此换许可。想要 v6 那套更强的
      # 缓存就升上去，或者升上去再写 cache-provider: basic 留在 MIT 那一侧。
      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew :app:test --console=plain

      - name: Android lint
        run: ./gradlew :app:lint --console=plain

      # nightly 和正式版用同一把发布密钥，所以两者可以互相覆盖安装 —— 换来换去都不必
      # 卸载，应用内的评审记录也不会被清掉。密钥库以 base64 存在 secret 里，这里解回
      # 一个只存在于本次运行的临时文件，路径写进 GITHUB_ENV 供 build.gradle.kts 读取。
      #
      # 派生仓库发来的 PR 读不到 secret，那时这一步跳过、构建产出未签名的 APK。可以
      # 接受：那个产物只是用来证明「这次改动能构建」，不会发布。
      - name: Restore the release keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PHOTO_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # master 上的产物是要发出去的，所以这里缺密钥必须当场失败，而不是发一个装不上
      # 的未签名包。别的分支不发布，缺就缺了。
      - name: A published nightly needs all four signing secrets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ] || missing="$missing PHOTO_RELEASE_KEYSTORE_BASE64"
          [ -n "$PHOTO_RELEASE_STORE_PASSWORD" ] || missing="$missing PHOTO_RELEASE_STORE_PASSWORD"
          [ -n "$PHOTO_RELEASE_KEY_ALIAS" ] || missing="$missing PHOTO_RELEASE_KEY_ALIAS"
          [ -n "$PHOTO_RELEASE_KEY_PASSWORD" ] || missing="$missing PHOTO_RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "缺少签名 secret：$missing" >&2
            echo "在 Settings → Secrets and variables → Actions 里补齐，四个的含义见 AGENTS.md。" >&2
            exit 1
          fi

      # 发出去的是 nightly 变体：它 initWith(release)，R8、资源压缩、不可调试和签名
      # 都和 release 一致，区别只是它构建自 master 的任意一个提交而不是一个标签。
      # debug 变体不适合发布：它带着 Compose 的调试工具、也没跑 R8，体积是十几倍。
      - name: Nightly APK
        run: ./gradlew :app:assembleNightly --console=plain

      # 版本号只在 gradle.properties 里声明一次，这里读它而不是再抄一遍。
      # 产物名带上版本和短 SHA：一个下载下来的 APK 要能自己说明它是哪次构建。
      #
      # 签名配置缺失时 AGP 不会报错，只会产出 *-unsigned.apk，所以要发布的那个真的
      # 验一遍签名，而不是相信 assembleNightly 的退出码。
      #
      # 名字不经 job outputs 交给下一个 job：GitHub 认为一个 job 输出里含有某个 secret
      # 的值时，会静默地把它变成空字符串（日志里只有一条 "Skip output ... since it may
      # contain secret" 注解），于是发布那一步拿着空文件名去上传。prerelease 自己在下载
      # 下来的目录里找这个 APK，版本号也自己读同一个 gradle.properties。
      - name: Name the APK after the version and the commit
        run: |
          version=$(sed -n 's/^photoVersionName=//p' gradle.properties)
          built=$(find app/build/outputs/apk/nightly -name '*.apk' | head -1)
          if [ -n "$KEYSTORE_B64" ]; then
            case "$built" in
              *unsigned*)
                echo "有签名密钥却产出了未签名 APK：$built" >&2
                exit 1
                ;;
            esac
            apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name 'apksigner' | sort -V | tail -1)
            "$apksigner" verify --print-certs "$built"
          fi
          mkdir -p artifacts
          cp "$built" "artifacts/photo-organizer-v$version-$(git rev-parse --short HEAD).apk"

      - uses: actions/upload-artifact@v7
        with:
          name: photo-organizer-apk
          path: artifacts/*.apk
          if-no-files-found: error

      # 失败时报告比日志有用得多，所以无论成败都上传。
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          if-no-files-found: ignore

  prerelease:
    # 挂在 build 后面，发的也是 build 产出的那个文件：预发布里的 APK 必须是刚跑完
    # 测试、lint 和构建的那一个，而不是另起一次构建的另一个。
    # 只在 master 上发 —— nightly 这个标签的含义是「master 的最新提交」。
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: photo-organizer-apk
          path: artifacts

      # gh 已经装在 runner 上，所以这一步不引入任何第三方 action。
      # 删掉再建是为了让 nightly 这个 tag 始终指向最新的提交。
      - name: Refresh the rolling nightly prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # APK 在上一步下载下来的目录里，版本号来自这次检出的 gradle.properties ——
          # 两个 job 检出的是同一个提交，所以不必经 job outputs 传（理由见 build 里
          # 那段注释）。三个值缺一个就在删掉现有预发布之前失败：把发布删掉再发现发不
          # 出来，留下的是一个连下载都没有的 nightly。
          apk=$(find artifacts -name '*.apk' | head -1)
          version=$(sed -n 's/^photoVersionName=//p' gradle.properties)
          code=$(sed -n 's/^photoVersionCode=//p' gradle.properties)
          if [ ! -f "$apk" ] || [ -z "$version" ] || [ -z "$code" ]; then
            echo "发布前的检查没过：apk=[$apk] version=[$version] code=[$code]" >&2
            exit 1
          fi

          # 先赋值再 echo：提交标题里的反引号不会在双引号里被当成命令展开。
          sha=$(git rev-parse --short HEAD)
          subject=$(git log -1 --pretty=%s)
          {
            echo "master 最新提交的自动构建，每次推送刷新。"
            echo
            echo "- 版本：**v$version**（versionCode \`$code\`）"
            echo "- 提交：\`$sha\` — $subject"
            echo "- 构建：nightly · CI #$RUN_NUMBER"
            echo "- 系统要求：Android 13（API 33）及以上"
            echo
            echo "> **nightly 构建**：代码压缩、资源压缩、「不可调试」和签名密钥都和正式版一致，区别只是它构建自 master 的任意一个提交。因此 nightly 与正式版之间可以直接覆盖安装，不需要卸载。"
          } > "$RUNNER_TEMP/notes.md"

          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            --target "$GITHUB_SHA" \
            --title "照片整理 v$version · 构建 #$RUN_NUMBER" \
            --prerelease \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$apk"
