name: Prerelease

# master 每次推送都刷新同一个 `nightly` 预发布，附带一个可以直接装的 APK。
# 想发正式版时用 gradle.properties 里的 photoVersionCode/photoVersionName 手动发。
on:
  push:
    branches: [master]
    paths-ignore:
      - 'index.html'
      - 'assets/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: prerelease
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # 四个 secret 都设了就产出签过名的 release APK；一个都没设就退回 debug APK。
      # 不这样退回的话，未签名的 release APK 根本装不上，等于上传了一个废文件。
      KEYSTORE_B64: ${{ secrets.PHOTO_RELEASE_KEYSTORE_BASE64 }}
      PHOTO_RELEASE_STORE_PASSWORD: ${{ secrets.PHOTO_RELEASE_STORE_PASSWORD }}
      PHOTO_RELEASE_KEY_ALIAS: ${{ secrets.PHOTO_RELEASE_KEY_ALIAS }}
      PHOTO_RELEASE_KEY_PASSWORD: ${{ secrets.PHOTO_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Point the wrapper at the upstream Gradle distribution
        run: |
          sed -i 's#mirrors.cloud.tencent.com/Gradle/#services.gradle.org/distributions/#' \
            gradle/wrapper/gradle-wrapper.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the release keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PHOTO_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        id: build
        env:
          # run_number 单调递增，所以每个 nightly 的 versionCode 都比上一个大，
          # 装新的能直接覆盖旧的。
          PHOTO_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            ./gradlew :app:assembleRelease --console=plain
            apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            ./gradlew :app:assembleDebug --console=plain
            apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi
          name="photo-organizer-nightly-${{ github.run_number }}-$(git rev-parse --short HEAD).apk"
          mv "$apk" "$RUNNER_TEMP/$name"
          echo "apk=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"

      # gh 已经装在 runner 上，所以这一步不引入任何第三方 action。
      # 删掉再建是为了让 nightly 这个 tag 始终指向最新的提交。
      - name: Refresh the rolling nightly prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          VARIANT: ${{ steps.build.outputs.variant }}
          APK: ${{ steps.build.outputs.apk }}
        run: |
          # 先赋值再 echo：提交标题里的反引号不会在双引号里被当成命令展开。
          sha=$(git rev-parse --short HEAD)
          subject=$(git log -1 --pretty=%s)
          {
            echo "master 最新提交的自动构建，随每次推送刷新。"
            echo
            echo "提交：\`$sha\` — $subject"
            echo "构建类型：\`$VARIANT\` · versionCode \`$RUN_NUMBER\`"
            echo "最低系统要求：Android 13（API 33）"
            if [ "$VARIANT" = debug ]; then
              echo
              echo "> 这是 **debug** 构建，用来试用：它可被调试，也没有代码压缩。仓库里配好 \`PHOTO_RELEASE_KEYSTORE_BASE64\`、\`PHOTO_RELEASE_STORE_PASSWORD\`、\`PHOTO_RELEASE_KEY_ALIAS\`、\`PHOTO_RELEASE_KEY_PASSWORD\` 四个 secret 之后，这里会自动换成签过名的 release 版。"
            fi
          } > "$RUNNER_TEMP/notes.md"

          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            --target "$GITHUB_SHA" \
            --title "照片整理 nightly · build $RUN_NUMBER" \
            --prerelease \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$APK"
