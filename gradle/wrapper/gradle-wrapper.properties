distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# The mirror, now with the checksum that pins what it is allowed to hand over.
#
# The URL is a Tencent mirror because it is far faster from where this is developed. The
# problem was never the host, it was that there was no distributionSha256Sum at all: every
# local build - including the one that signs a release with the real keystore - trusted an
# unaudited third party to supply the build tool itself, and a tampered ZIP is arbitrary
# code execution with the signing key in reach. Both workflows also rewrite this URL back
# to services.gradle.org, so CI could not have detected a swapped distribution either.
#
# The hash is of the file, not of the host, so it holds for the mirror and for the upstream
# URL the workflows substitute. Either route now produces the real 9.5.0 distribution or
# fails; there is no third outcome.
distributionUrl=https\://mirrors.cloud.tencent.com/Gradle/gradle-9.5.0-bin.zip
distributionSha256Sum=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746
networkTimeout=120000
retries=3
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists